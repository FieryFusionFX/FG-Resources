$engine: 3
name: Fierygames Qbox Base
version: 1.0.0
author: Fierygames
description: >
  Qbox/qbx base template - repair kits, universal garage retrieval,
  auto-store on disconnect, vehicle blips, gun licenses at City Hall,
  laundering fronts, a 174-vehicle add-on pack, custom shops, and dynamic
  native police. Deploys blank - no characters, vehicles, or mail carry over.

variables:
  adminIdentifier: "identifier.fivem:4707155"
  discordLink: ""

tasks:
  # Small root files - plain HTTP fetch, no GitHub API involved
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/server.cfg
    path: ./server.cfg
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/ox.cfg
    path: ./ox.cfg
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/voice.cfg
    path: ./voice.cfg
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/permissions.cfg
    path: ./permissions.cfg
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/misc.cfg
    path: ./misc.cfg
  - action: download_file
    url: https://raw.githubusercontent.com/FieryFusionFX/FG-Resources/main/myLogo.png
    path: ./myLogo.png

  # Resources - one bracket folder per download_github call (subpath), so no
  # single request has to move the whole 5.6GB repo at once
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[assets]
    dest: ./resources/[assets]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[cfx-default]
    dest: ./resources/[cfx-default]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[custom]
    dest: ./resources/[custom]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[npwd-apps]
    dest: ./resources/[npwd-apps]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[npwd]
    dest: ./resources/[npwd]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[ox]
    dest: ./resources/[ox]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[qbx]
    dest: ./resources/[qbx]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[standalone]
    dest: ./resources/[standalone]
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[voice]
    dest: ./resources/[voice]

  # The big one - ~5.5GB, needs far more than the 150s default timeout
  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: resources/[Autos]
    dest: ./resources/[Autos]
    timeoutSeconds: 7200

  - action: download_github
    src: https://github.com/FieryFusionFX/FG-Resources
    ref: main
    subpath: database-backup
    dest: ./tmp/database-backup
    timeoutSeconds: 300

  # secrets.cfg is the only thing that's per-deployment - build it from the
  # wizard's answers (write_file doesn't template on its own, hence the
  # follow-up replace_string in all_vars mode)
  - action: write_file
    file: ./secrets.cfg
    data: |
      ## --- Cfx.re license (from https://keymaster.fivem.net/) ---
      sv_licenseKey "{{svLicense}}"

      ## --- Database connection ---
      set mysql_connection_string "{{dbConnectionString}}"

      ## --- Server branding ---
      sv_hostname "{{serverName}} built with {{recipeName}} by {{recipeAuthor}}!"
      sets sv_projectName "[Qbox Project] {{serverName}}"
      sets sv_projectDesc "{{recipeDescription}}"
      set qbx:discordLink "{{discordLink}}"

      ## --- Admin identity ---
      add_principal {{adminIdentifier}} group.admin

      ## --- Third-party API keys (optional, leave blank if unused) ---
      set steam_webApiKey "none"
      set SCREENSHOT_BASIC_TOKEN ""
      set NPWD_AUDIO_TOKEN ""
      set inventory:webhook ""

  - action: replace_string
    file: ./secrets.cfg
    mode: all_vars

  # Database - blank template (no characters/vehicles/mail, just schema +
  # society accounts/door configs)
  - action: connect_database
  - action: query_database
    file: ./tmp/database-backup/Qbox_A1B5B5_deploy.sql

  - action: remove_path
    path: ./tmp
